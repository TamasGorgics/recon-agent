# Local Postgres for development and integration tests.
# The image tag is pinned (HD-IMP-03) and mirrored by .github/workflows/ci.yml.
#
# The init script runs only when the named volume is first created. It creates
# the four NOLOGIN group roles and four local-only development logins (M1-04,
# ADR 0005). Existing volumes must be recreated with `docker compose down -v`
# or the script run manually; see compose/initdb/01-roles.sql.
#
# Phoenix is the local OTLP trace viewer for M5-01. It is dev-only: auth is
# intentionally disabled so the local demo needs no credentials. Published
# ports are bound to 127.0.0.1 so an unauthenticated Phoenix is never exposed
# on the LAN; do not widen these bindings on an untrusted network.
services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: recon
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - recon-pgdata:/var/lib/postgresql/data
      - ./compose/initdb/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d recon"]
      interval: 2s
      timeout: 3s
      retries: 30

  phoenix:
    # Pinned reviewed tag (spec §8.1); never `latest`. Phoenix 22 serves the
    # UI and REST/GraphQL API on 6006, OTLP/gRPC on 4317, and OTLP/HTTP on
    # 6006/v1/traces — the image exposes no 4318. Mapping host 4318 to the
    # container's 6006 keeps the spec's OTEL_EXPORTER_OTLP_ENDPOINT contract:
    # http://localhost:4318 uses the exporter's automatic /v1/traces path.
    image: arizephoenix/phoenix:22.0.1
    environment:
      PHOENIX_WORKING_DIR: /data
      # Local demo only. Phoenix 21+ enables auth when PHOENIX_HOST is
      # non-loopback (the image sets PHOENIX_HOST=::), which would reject
      # OTLP exports with 401 and require a UI login. Host ports below are
      # loopback-bound, so auth stays off only for the local dev service.
      PHOENIX_ENABLE_AUTH: "false"
    ports:
      - "127.0.0.1:6006:6006" # UI, REST API, GraphQL
      - "127.0.0.1:4317:4317" # OTLP/gRPC
      - "127.0.0.1:4318:6006" # OTLP/HTTP; Phoenix serves /v1/traces on the UI port
    volumes:
      - recon-phoenix-data:/data

  prometheus:
    # Self-scrape only (M5-04 decision AQ-3). The pinned tag is asserted by
    # internal/dashboards tests and docs/ROADMAP.md evidence.
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - recon-prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    # Dev-only Grafana. Anonymous access, sign-up, analytics, and plugin
    # preinstall are disabled; the admin and dashboard DB passwords come from
    # local environment variables with explicitly non-secret dev defaults.
    image: grafana/grafana:13.3.2
    environment:
      GF_SECURITY_ADMIN_USER: ${RECON_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${RECON_GRAFANA_ADMIN_PASSWORD:-recon_admin_local_only}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_INSTALL_PLUGINS: ""
      # Read-only dashboard datasource login (spec §4.2). Grafana expands these
      # into the provisioning YAML; the defaults are local-only and non-secret.
      RECON_DASHBOARDS_RO_USER: ${RECON_DASHBOARDS_RO_USER:-recon_dev_dashboards_ro}
      RECON_DASHBOARDS_RO_PASSWORD: ${RECON_DASHBOARDS_RO_PASSWORD:-recon_dev_dashboards_ro_local_only}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - recon-grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  recon-pgdata:
  recon-phoenix-data:
  recon-prometheus-data:
  recon-grafana-data:
