# Local Postgres for development and integration tests.
# The image tag is pinned (HD-IMP-03) and mirrored by .github/workflows/ci.yml.
#
# The init script runs only when the named volume is first created. It creates
# the four NOLOGIN group roles and four local-only development logins (M1-04,
# ADR 0005). Existing volumes must be recreated with `docker compose down -v`
# or the script run manually; see compose/initdb/01-roles.sql.
services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: recon
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - recon-pgdata:/var/lib/postgresql/data
      - ./compose/initdb/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d recon"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  recon-pgdata:
