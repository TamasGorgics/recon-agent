openapi: 3.1.0
info:
  title: Recon Agent API
  version: 0.1.0
  description: |
    Hand-written OpenAPI 3.1 contract for the M4-02 reconciliation API.
    Protected operations require a static bearer key configured through the
    API_KEYS environment variable. Roles are viewer < approver < admin.
servers:
  - url: /
tags:
  - name: health
  - name: ingest
  - name: reconcile
  - name: cases
  - name: proposals
  - name: admin
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness probe
      security: []
      x-required-role: none
      responses:
        "200":
          description: Process is alive. No dependency check is performed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /metrics:
    get:
      tags: [health]
      operationId: getMetrics
      summary: Prometheus text stub
      security: []
      x-required-role: none
      responses:
        "200":
          description: Static build information in Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
  /v1/ingest/files:
    post:
      tags: [ingest]
      operationId: ingestFile
      summary: Upload one settlement file
      security:
        - bearerAuth: []
      x-required-role: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [source, file]
              properties:
                source:
                  type: string
                  description: Configured source name (psp_a or bank_x).
                format:
                  type: string
                  description: File format; defaults to source.
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Ingested, quarantined, or an identical-bytes no-op.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/reconcile/run:
    post:
      tags: [reconcile]
      operationId: runReconcile
      summary: Run the matcher for a scope and persist breaks/cases
      description: |
        The matcher run and break/case persistence are separate transactions.
        A failure after a committed matcher run returns 500; retrying is safe
        because matcher runs are incremental and breaks dedupe on signature.
      security:
        - bearerAuth: []
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileRequest"
      responses:
        "200":
          description: Matcher statistics and persisted break/case counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/cases:
    get:
      tags: [cases]
      operationId: listCases
      summary: List case summaries with keyset pagination
      security:
        - bearerAuth: []
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/CaseStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of case summaries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/cases/{id}:
    get:
      tags: [cases]
      operationId: getCaseFile
      summary: Read one case file
      security:
        - bearerAuth: []
      x-required-role: viewer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Versioned case-file document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/proposals:
    get:
      tags: [proposals]
      operationId: listProposals
      summary: List proposal summaries with keyset pagination
      security:
        - bearerAuth: []
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/ProposalStatus"
        - $ref: "#/components/parameters/CaseID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of proposal summaries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/proposals/{id}/decision:
    post:
      tags: [proposals]
      operationId: decideProposal
      summary: Approve or reject one pending proposal
      description: |
        The authenticated API key is mapped to an approvers row, so the key
        value never appears in the request or response. The decision, approvals
        row, proposal transition, and audit entries commit in one transaction.
        Repeating the same decision as the same approver is a replay (200 with
        replayed=true). reason is optional and bounded; M4-11 validates it but
        the frozen decision service has no reason parameter yet.
      security:
        - bearerAuth: []
      x-required-role: approver
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalDecisionRequest"
      responses:
        "200":
          description: The recorded decision, or a same-approver replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDecisionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/switches:
    post:
      tags: [admin]
      operationId: setSwitch
      summary: Update one seeded system switch
      description: |
        The switch update and its audit entry commit in one transaction.
        Setting the current value returns changed=false and writes no audit row.
      security:
        - bearerAuth: []
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchRequest"
      responses:
        "200":
          description: The switch state after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwitchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque base64url keyset cursor from next_cursor.
      schema:
        type: string
    CaseStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [open, in_agent, proposal_pending, waiting_info, escalated, resolved]
    ProposalStatus:
      name: status
      in: query
      required: false
      description: pending is accepted as an alias of pending_approval.
      schema:
        type: string
        enum:
          - pending
          - proposed
          - pending_approval
          - approved
          - auto_approved
          - applied
          - apply_failed
          - rejected
          - expired
          - superseded
    CaseID:
      name: case_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid JSON, query, date range, scope ID, or request field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Missing, malformed, or unknown bearer key.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer realm="recon"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Valid key without the required role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The proposal is not pending, has expired, or conflicts with an existing decision.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Body exceeded max_json_bytes or max_upload_bytes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Content type is not application/json or multipart/form-data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Generic internal failure; no internal detail is returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_json
                - invalid_request
                - invalid_query
                - unsupported_filter
                - unsupported_source
                - invalid_scope_id
                - invalid_date_range
                - unauthenticated
                - forbidden
                - not_found
                - method_not_allowed
                - conflict
                - replay
                - payload_too_large
                - unsupported_media_type
                - internal_error
            message:
              type: string
        request_id:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    IngestResult:
      type: object
      required: [batch_id, status, no_op, parsed, inserted, skipped, quarantine_reason]
      properties:
        batch_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ingested, quarantined]
        no_op:
          type: boolean
        parsed:
          type: integer
        inserted:
          type: integer
        skipped:
          type: integer
        quarantine_reason:
          type: string
    ReconcileRequest:
      type: object
      additionalProperties: false
      required: [scope_id, from, to]
      properties:
        scope_id:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    ReconcileResult:
      type: object
      required: [run_id, scope_id, stats, breaks, breaks_created, breaks_existing, cases_created]
      properties:
        run_id:
          type: string
          format: uuid
        scope_id:
          type: string
          format: uuid
        stats:
          $ref: "#/components/schemas/MatchStats"
        breaks:
          type: integer
        breaks_created:
          type: integer
        breaks_existing:
          type: integer
        cases_created:
          type: integer
    MatchStats:
      type: object
      required:
        - external_candidates
        - ledger_candidates
        - matched
        - unmatched_external
        - unmatched_ledger
        - breaks
        - breaks_by_side
        - by_pass
      properties:
        external_candidates:
          type: integer
        ledger_candidates:
          type: integer
        matched:
          type: integer
        unmatched_external:
          type: integer
        unmatched_ledger:
          type: integer
        breaks:
          type: integer
        breaks_by_side:
          type: object
          additionalProperties:
            type: integer
        by_pass:
          type: object
          additionalProperties:
            type: integer
    CaseSummary:
      type: object
      required: [id, priority, value_minor, currency, status, version, attempts, created_at, break_ids]
      properties:
        id:
          type: string
          format: uuid
        priority:
          type: integer
        value_minor:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
        version:
          type: integer
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        break_ids:
          type: array
          items:
            type: string
            format: uuid
    CaseList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CaseSummary"
        next_cursor:
          type: string
    CaseFile:
      type: object
      description: |
        Version 2 of the case document. The existing case/breaks/proposals/
        agent_runs sections are unchanged from version 1. The top-level trace
        section is one consistent snapshot of the case's applied proposals:
        one chain per applied_proposals row, including applications with no
        ledger transaction (ledger_txn_id null). Later tasks may add top-level
        sections; clients must ignore unknown fields. Rationale is sanitized
        and truncated to 4000 characters; raw evidence and external payloads
        are not returned. policy.config_yaml is the exact stored policy
        threshold/rule configuration, not secrets.
      required: [schema_version, case, breaks, proposals, agent_runs, trace]
      properties:
        schema_version:
          type: integer
          const: 2
        case:
          $ref: "#/components/schemas/Case"
        breaks:
          type: array
          items:
            $ref: "#/components/schemas/Break"
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/ProposalDetail"
        agent_runs:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
        trace:
          $ref: "#/components/schemas/CaseFileTrace"
    CaseFileTrace:
      type: object
      description: |
        The case-file v2 trace snapshot. case is the resolved case link and is
        the same shape as each chain's case link (it does not repeat the
        document's break_ids list). chains and missing are always arrays.
      required: [case, chains, missing]
      properties:
        case:
          $ref: "#/components/schemas/TraceCase"
        chains:
          type: array
          items:
            $ref: "#/components/schemas/TraceChain"
        missing:
          type: array
          items:
            $ref: "#/components/schemas/TraceMissingMarker"
    TraceMissingMarker:
      type: string
      description: One absent link or empty sub-collection, in spec order.
      enum:
        - applied_proposal
        - proposal
        - case
        - breaks
        - agent_run
        - agent_run.trace_id
        - verification
        - policy
        - policy_config
        - approvals
        - executor.audit
        - ledger_txn
        - ledger_entries
    TraceChain:
      type: object
      description: |
        One applied proposal and every link reachable from it. Nullable links
        stay in the chain with their missing marker instead of disappearing.
      required:
        - ledger_txn_id
        - applied_proposal
        - proposal
        - case
        - breaks
        - agent_run
        - verification
        - policy
        - approvals
        - executor
        - ledger_txn
        - ledger_entries
        - missing
      properties:
        ledger_txn_id:
          type: [string, "null"]
          format: uuid
          description: applied_proposals.ledger_txn_id; null when the application posted no ledger transaction.
        applied_proposal:
          oneOf:
            - $ref: "#/components/schemas/TraceAppliedProposal"
            - type: "null"
        proposal:
          oneOf:
            - $ref: "#/components/schemas/TraceProposal"
            - type: "null"
        case:
          oneOf:
            - $ref: "#/components/schemas/TraceCase"
            - type: "null"
        breaks:
          type: array
          items:
            $ref: "#/components/schemas/Break"
        agent_run:
          oneOf:
            - $ref: "#/components/schemas/TraceAgentRun"
            - type: "null"
        verification:
          description: Stored proposal verification document exactly as persisted; null when absent.
        policy:
          oneOf:
            - $ref: "#/components/schemas/TracePolicy"
            - type: "null"
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/TraceApproval"
        executor:
          $ref: "#/components/schemas/TraceExecutor"
        ledger_txn:
          oneOf:
            - $ref: "#/components/schemas/TraceLedgerTxn"
            - type: "null"
        ledger_entries:
          type: array
          items:
            $ref: "#/components/schemas/TraceLedgerEntry"
        missing:
          type: array
          items:
            $ref: "#/components/schemas/TraceMissingMarker"
    TraceCase:
      type: object
      required:
        - id
        - priority
        - value_minor
        - currency
        - status
        - version
        - attempts
        - escalation_reason
        - created_at
        - resolved_at
        - resolution_type
      properties:
        id:
          type: string
          format: uuid
        priority:
          type: integer
        value_minor:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
        version:
          type: integer
        attempts:
          type: integer
        escalation_reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        resolution_type:
          type: [string, "null"]
    TraceAppliedProposal:
      type: object
      required: [proposal_id, ledger_txn_id, applied_at, executor_run_id]
      properties:
        proposal_id:
          type: string
          format: uuid
        ledger_txn_id:
          type: [string, "null"]
          format: uuid
        applied_at:
          type: string
          format: date-time
        executor_run_id:
          type: string
    TraceProposal:
      type: object
      required: [id, case_id, agent_run_id, type, status, risk_tier, created_at]
      properties:
        id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        agent_run_id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
        risk_tier:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    TraceAgentRun:
      type: object
      required:
        - id
        - model
        - prompt_version
        - started_at
        - ended_at
        - outcome
        - trace_id
      properties:
        id:
          type: string
          format: uuid
        model:
          type: string
        prompt_version:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        outcome:
          type: [string, "null"]
        trace_id:
          type: [string, "null"]
          description: OTel trace id; a blank value is reported as the agent_run.trace_id marker.
    TracePolicy:
      type: object
      description: |
        The stored policy decision joined to the referenced policy config
        version. config_yaml is threshold/rule configuration, not secrets.
      required: [risk_tier, rule, reasons, config_hash, config_yaml, config_loaded_at]
      properties:
        risk_tier:
          type: [string, "null"]
        rule:
          type: string
        reasons:
          type: array
          items:
            type: string
        config_hash:
          type: string
        config_yaml:
          type: [string, "null"]
          description: |
            Exact stored policy_config_versions.yaml. This is threshold/rule
            configuration, not secrets.
        config_loaded_at:
          type: [string, "null"]
          format: date-time
    TraceApproval:
      type: object
      required:
        - id
        - channel
        - external_ref
        - decision
        - decided_at
        - signature_valid
        - approver
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
        external_ref:
          type: [string, "null"]
        decision:
          type: string
          enum: [approved, rejected]
        decided_at:
          type: string
          format: date-time
        signature_valid:
          type: boolean
        approver:
          $ref: "#/components/schemas/TraceApprover"
    TraceApprover:
      type: object
      required: [id, display_name, role]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          type: string
          enum: [viewer, approver, admin]
    TraceExecutor:
      type: object
      required: [audit]
      properties:
        audit:
          oneOf:
            - $ref: "#/components/schemas/TraceExecutorAudit"
            - type: "null"
    TraceExecutorAudit:
      type: object
      description: The executor.applied audit_log row attributable to the proposal.
      required: [seq, ts, actor, before, after]
      properties:
        seq:
          type: integer
          format: int64
        ts:
          type: string
          format: date-time
        actor:
          type: string
        before:
          description: Stored audit before document (arbitrary JSON, nullable).
        after:
          description: Stored audit after document; carries ledger_txn_id, applied_at, and executor_run_id.
    TraceLedgerTxn:
      type: object
      required:
        - id
        - seq
        - kind
        - value_date
        - created_at
        - booked_at
        - description
        - period_id
        - adjusts_period_id
        - reversal_of
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - charge
            - refund
            - payout
            - fee
            - chargeback
            - fx
            - adjustment
            - reversal
        value_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        booked_at:
          type: string
          format: date-time
        description:
          type: string
        period_id:
          type: string
          format: uuid
        adjusts_period_id:
          type: [string, "null"]
          format: uuid
        reversal_of:
          type: [string, "null"]
          format: uuid
    TraceLedgerEntry:
      type: object
      required:
        - id
        - txn_id
        - account_id
        - account_code
        - direction
        - amount_minor
        - currency
        - posted_at
        - external_ref
      properties:
        id:
          type: string
          format: uuid
        txn_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        account_code:
          type: string
        direction:
          type: string
          enum: [debit, credit]
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
        posted_at:
          type: string
          format: date-time
        external_ref:
          type: [string, "null"]
    Case:
      type: object
      required:
        - id
        - priority
        - value_minor
        - currency
        - status
        - version
        - attempts
        - escalation_reason
        - created_at
        - resolved_at
        - resolution_type
        - break_ids
      properties:
        id:
          type: string
          format: uuid
        priority:
          type: integer
        value_minor:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
        version:
          type: integer
        attempts:
          type: integer
        escalation_reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
        resolution_type:
          type: [string, "null"]
        break_ids:
          type: array
          items:
            type: string
            format: uuid
    Break:
      type: object
      required:
        - id
        - signature
        - scope_id
        - match_run_id
        - side
        - ledger_txn_ids
        - external_refs
        - delta_minor
        - currency
        - status
        - detected_at
      properties:
        id:
          type: string
          format: uuid
        signature:
          type: string
          pattern: "^[0-9a-f]{64}$"
        scope_id:
          type: string
          format: uuid
        match_run_id:
          type: string
          format: uuid
        side:
          type: string
          enum: [ledger_only, external_only, amount_mismatch, duplicate]
        ledger_txn_ids:
          type: array
          items:
            type: string
            format: uuid
        external_refs:
          type: array
          items:
            $ref: "#/components/schemas/RecordRef"
        delta_minor:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
          enum: [open, in_case, resolved, superseded, void]
        detected_at:
          type: string
          format: date-time
    RecordRef:
      type: object
      required: [source, source_record_id]
      properties:
        source:
          type: string
        source_record_id:
          type: string
    ProposalDetail:
      type: object
      required:
        - id
        - type
        - status
        - risk_tier
        - confidence
        - pattern_claimed
        - pattern_verified
        - rationale
        - evidence_refs
        - created_at
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
        risk_tier:
          type: [string, "null"]
        confidence:
          type: number
        pattern_claimed:
          type: [string, "null"]
        pattern_verified:
          type: [string, "null"]
        rationale:
          type: string
          maxLength: 4000
        evidence_refs:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
    ProposalSummary:
      type: object
      required:
        - id
        - case_id
        - type
        - status
        - risk_tier
        - confidence
        - pattern_claimed
        - pattern_verified
        - created_at
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
        risk_tier:
          type: [string, "null"]
        confidence:
          type: number
        pattern_claimed:
          type: [string, "null"]
        pattern_verified:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
    ProposalList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProposalSummary"
        next_cursor:
          type: string
    AgentRun:
      type: object
      required:
        - id
        - model
        - prompt_version
        - started_at
        - ended_at
        - outcome
        - tokens_in
        - tokens_out
        - cost_usd
        - trace_id
      properties:
        id:
          type: string
          format: uuid
        model:
          type: string
        prompt_version:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        outcome:
          type: [string, "null"]
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        cost_usd:
          type: string
          description: Decimal USD string; money never crosses JSON as a float.
        trace_id:
          type: [string, "null"]
    SwitchRequest:
      type: object
      additionalProperties: false
      required: [name, enabled, reason]
      properties:
        name:
          type: string
          enum: [agent_enabled, auto_apply_enabled]
        enabled:
          type: boolean
        reason:
          type: string
          minLength: 1
          maxLength: 500
    SwitchResult:
      type: object
      required: [name, enabled, changed, updated_by, updated_at]
      properties:
        name:
          type: string
        enabled:
          type: boolean
        changed:
          type: boolean
        updated_by:
          type: string
          description: Canonical human:<key-id> actor string.
        updated_at:
          type: string
          format: date-time
    ProposalDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reason:
          type: string
          maxLength: 2000
          description: Optional audit reason. Reserved until the decision service carries a reason.
    ProposalDecisionResult:
      type: object
      required: [proposal_id, status, decision, approver_id, decided_at, replayed]
      properties:
        proposal_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [approved, rejected]
        decision:
          type: string
          enum: [approved, rejected]
        approver_id:
          type: string
          format: uuid
        decided_at:
          type: string
          format: date-time
        replayed:
          type: boolean
          description: True when the same approver repeated the same decision and nothing was written.
